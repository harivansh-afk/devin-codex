[package]
name = "devin-codex"
version = "0.4.3"
edition = "2024"
description = "Run Codex with Devin inference"
publish = false

[dependencies]
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
httpdate = "1"
prost = "0.14"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[profile.release]
lto = "thin"
strip = true
