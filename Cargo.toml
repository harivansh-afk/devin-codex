[package]
name = "devin-codex"
version = "0.3.1"
edition = "2024"
description = "Run Codex with Devin inference"
publish = false

[dependencies]
async-stream = "0.3"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[profile.release]
lto = "thin"
strip = true
